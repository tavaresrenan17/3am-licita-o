name: Sincronização PNCP

on:
  schedule:
    # UTC: incremental a cada 3 h, exceto a janela reservada à carga diária.
    # O agendador do GitHub não é pontual: de 18 a 23/09/2026 disparou 3 a 6 dos
    # 8 horários por dia, com 1,5 a 3 h de atraso (a diária das 06:47 UTC rodou
    # entre 12:03 e 13:21 UTC). Por isso cada execução tem janela longa: se um
    # horário é pulado, a execução anterior ainda está sondando o PNCP.
    - cron: "17 0,3,9,12,15,18,21 * * *"
    # 06:47 UTC = 03:47 em São Paulo. Minutos diferentes evitam a fila da hora cheia.
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: Rotina a executar
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - completa

permissions:
  contents: read

# Descoberta e incremental compartilham o mesmo grupo para nunca concorrerem.
concurrency:
  group: pncp-sincronizacao-producao
  cancel-in-progress: false

jobs:
  incremental:
    if: github.event.schedule == '17 0,3,9,12,15,18,21 * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'incremental')
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 2 h 40 min: tempo de esperar o PNCP voltar, que em 23/09/2026 ficou fora
      # por horas e voltou em janelas de 1,5 a 4 min. Repositório público não
      # paga minutos do Actions.
      SYNC_MAX_RUNTIME_MS: "9600000"
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "Secret SUPABASE_URL ausente"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Secret SUPABASE_SERVICE_ROLE_KEY ausente"; exit 1; }
      - name: Atualizar somente registros novos ou alterados
        run: npm run sincronizar -- incremental --uf SP

  completa-diaria:
    if: github.event.schedule == '47 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'completa')
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_MAX_RUNTIME_MS: "9000000"
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "Secret SUPABASE_URL ausente"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Secret SUPABASE_SERVICE_ROLE_KEY ausente"; exit 1; }
      - name: Reconciliar oportunidades abertas de SP
        run: npm run sincronizar -- --uf SP --horizonte 30
